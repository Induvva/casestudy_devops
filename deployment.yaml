
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tripplanner-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: tripplanner
  template:
    metadata:
      labels:
        app: tripplanner
    spec:
      containers:
        - name: tripplanner
          image: tripplanner:v1
          imagePullPolicy: Never
          ports:
            - containerPort: 5000
