<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Trip Feedback - TripMate</title>
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='tripplan.css') }}">
</head>
<body>
    <div class="plan-container">
        <header>
            <div class="header-content">
                <div>
                    <h1>Trip Feedback for {{ trip.destination }}</h1>
                    <p>Please share your feedback about your trip.</p>
                </div>
                <a href="{{ url_for('logout') }}" class="logout-button">Logout</a>
            </div>
        </header>

        <section class="form-section">
            {% with messages = get_flashed_messages() %}
              {% if messages %}
                <div class="flash-messages">
                  {% for message in messages %}
                    <div class="flash-message">{{ message }}</div>
                  {% endfor %}
                </div>
              {% endif %}
            {% endwith %}
            <form action="{{ url_for('submit_trip_feedback', trip_id=trip.id) }}" method="POST">
                <div class="form-group">
                    <label for="enjoyed_most">What did you enjoy the most?</label>
                    <textarea id="enjoyed_most" name="enjoyed_most" rows="3" required style="width: 100%; padding: 10px; font-size: 1rem;"></textarea>
                </div>
                <div class="form-group">
                    <label for="could_be_better">What could’ve been better?</label>
                    <textarea id="could_be_better" name="could_be_better" rows="3" required style="width: 100%; padding: 10px; font-size: 1rem;"></textarea>
                </div>
                <div class="form-group">
                    <label for="recommend_friend">Would you recommend this trip to a friend?</label>
                    <select id="recommend_friend" name="recommend_friend" required style="width: 100%; padding: 10px; font-size: 1rem;">
                        <option value="" disabled selected>Select an option</option>
                        <option value="Yes">Yes</option>
                        <option value="No">No</option>
                        <option value="Maybe">Maybe</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="issues">Any issues during the trip?</label>
                    <textarea id="issues" name="issues" rows="3" style="width: 100%; padding: 10px; font-size: 1rem;"></textarea>
                </div>
                <div class="form-group">
                    <label for="star_rating">Star Rating:</label>
                    <select id="star_rating" name="star_rating" required style="width: 100%; padding: 10px; font-size: 1rem;">
                        <option value="" disabled selected>Select rating</option>
                        <option value="1">1 - Poor</option>
                        <option value="2">2 - Fair</option>
                        <option value="3">3 - Good</option>
                        <option value="4">4 - Very Good</option>
                        <option value="5">5 - Excellent</option>
                    </select>
                </div>
                <button type="submit" class="plan-button" style="margin-top: 10px;">Submit Feedback</button>
            </form>
            <p><a href="{{ url_for('trip_history') }}">Back to Trip History</a> | <a href="{{ url_for('main') }}">Back to Main</a></p>
        </section>
    </div>
</body>
</html>
